server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # .geojson is not in nginx's mime.types, so it would be served as
    # application/octet-stream and skipped by gzip. The extract is ~75 MB raw and
    # ~7 MB gzipped, so this mapping is doing real work.
    types {
        application/geo+json geojson;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/geo+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # GeoJSON / FlatGeobuf / PMTiles - regenerated only when the geodatabase changes
    location ~* \.(geojson|fgb|pmtiles)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Explicit root route
    location = / {
        default_type text/html;
        try_files /index.html =404;
    }
}