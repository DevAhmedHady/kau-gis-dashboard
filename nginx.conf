server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: never declare a server-level `types` block here — it REPLACES the
    # full mime.types map inherited from the http context, which breaks
    # Content-Type for .js/.css/fonts (served as application/octet-stream).

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/geo+json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # GeoJSON / FlatGeobuf / PMTiles — types scoped to this location so the
    # global mime map stays intact for other extensions.
    location ~* \.(geojson|fgb|pmtiles)$ {
        types {
            application/geo+json geojson;
            application/octet-stream fgb pmtiles;
        }
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Explicit root route
    location = / {
        default_type text/html;
        try_files /index.html =404;
    }
}
