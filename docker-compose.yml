version: '3.8'

services:
  kau-gis-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kau-gis-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - kau-network

networks:
  kau-network:
    driver: bridge